services:
  # ----------------------------------------------------
  # 1. InternTrack Backend Web Service (Node.js/Express)
  # ----------------------------------------------------
  - type: web
    name: interntrack-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard with MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          name: interntrack-client
          type: web
          property: host

  # ----------------------------------------------------
  # 2. InternTrack Frontend Static Site (React / Vite)
  # ----------------------------------------------------
  - type: web
    name: interntrack-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule so refreshing nested routes (/dashboard, /tasks, etc.) works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: interntrack-server
          type: web
          property: host
          path: /api
